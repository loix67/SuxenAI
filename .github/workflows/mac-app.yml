name: macOS app
on:
  workflow_dispatch:
  push:
    branches: ['feat/connections-v0-8']
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install 'pyinstaller==6.22.3' certifi
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name SuxenAI --osx-bundle-identifier org.suxenai.local --add-data 'static:static' launcher.py
      - run: dist/SuxenAI.app/Contents/MacOS/SuxenAI --self-test
      - run: ditto -c -k --sequesterRsrc --keepParent dist/SuxenAI.app SuxenAI-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuxenAI-${{ matrix.architecture }}
          path: SuxenAI-${{ matrix.architecture }}.zip
